name: build-dds-engine

# Builds the engine image on GitHub's runners and pushes to GHCR.
# Nothing is built on Grant's Mac and no GPU pod is involved, so a rebuild
# costs $0 in RunPod time.

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'constraints.txt'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      comfy_ref:
        description: 'ComfyUI git ref to pin (branch, tag or commit SHA)'
        required: false
        default: 'master'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # The image is large (torch + cu124 + nodes). Reclaim runner disk or the
      # build dies with "no space left on device".
      - name: Free up runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.run_number }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMFY_REF=${{ github.event.inputs.comfy_ref || 'master' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Result
        run: |
          echo "### Image pushed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Use the \`latest\` tag as the RunPod template image." >> $GITHUB_STEP_SUMMARY
